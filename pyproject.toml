[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fouclnet"
version = "1.0.0"
description = "FouCLNet: Fourier-feature network reconstruction of weak-signal forced-vibration responses"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["PINN", "Fourier features", "curriculum learning", "signal reconstruction", "physics-informed"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.0",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/Sean-Lie159/fouclnet-pinn"
Repository = "https://github.com/Sean-Lie159/fouclnet-pinn.git"
Issues = "https://github.com/Sean-Lie159/fouclnet-pinn/issues"
Paper = "https://chineseoptics.net.cn/cn/article/doi/10.3724/CO.2026-0083"

[project.optional-dependencies]
dev = ["pytest>=7.4", "PyYAML>=6.0"]

[tool.setuptools]

package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
