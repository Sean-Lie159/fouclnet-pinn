name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  self-test:
    name: self-test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Run self-tests
        run: python -m pytest tests -q
      - name: Check package import (lazy modules must work without torch data)
        run: python -c "from fouclnet.config import load_config; from fouclnet.metrics import summarize; print('import ok')"
